# Frozen normalization test cases - Phase 0 §8 realisation
#
# version: norm@v0.1  (SEED - see coverage note below)
#
# COVERAGE NOTE (honest status):
# Phase 0 §8.2 requires >=25 cases per category and >=40 in N-AMB. This file
# is a SEED that does not yet meet those counts. The shortfall is recorded in
# docs/phase1/normalization_audit.md and is an OPEN Phase 1 exit-criterion gap.
# Structure and determinism labelling are frozen; case COUNT is not yet met.
#
# determinism:
#   exact     - Phase 0 specifies the output verbatim. Release-blocking.
#   preferred - project-canonical form; alternatives acceptable.
#   open      - Phase 0 defers the decision; may change without regression.
#
# lang: matrix language expected for the utterance.

meta:
  version: "norm@v0.1"
  frozen: false
  phase0_ref: "docs/PHASE_0_REQUIREMENTS_FREEZE.md §8"

cases:

