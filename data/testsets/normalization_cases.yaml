  # ================= KNOWN-FAILING / NOT-YET-IMPLEMENTED (xfail) ========
  # These document real gaps rather than hiding them. Phase 0 §17 requires
  # failures to be recorded, not suppressed.
  - id: XF-001
    category: date
    determinism: open
    lang: en
    input: "Your trip is on 2/3/2026."
    expect_contains: "second of March"
    xfail: true
    xfail_reason: >
      Verbalizer emits '<ordinal> March <year>' without the preposition 'of'.
      Canonical English date phrasing not finalised. OPEN determinism.
  - id: XF-002
    category: number
    determinism: open
    lang: en
    input: "We served 1,50,000 rides."
    expect_contains: "one lakh fifty thousand"
    xfail: true
    xfail_reason: >
      Indian digit grouping (1,50,000) is parsed by stripping commas, which
      works, but the lakh/thousand composition wording is not yet verified.
  - id: XF-003
    category: ta_number
    determinism: open
    lang: ta
    input: "கட்டணம் 250 ரூபாய்."
    expect_contains: "இருநூற்றி ஐம்பது"
    xfail: true
    xfail_reason: >
      Tamil price/number forms are UNVALIDATED by a native speaker. Marked
      xfail so the suite does not assert correctness we have not verified.
  - id: XF-004
    category: pin_code
    determinism: open
    lang: en
    input: "Deliver to Chennai 600040."
    expect_contains: "six zero zero zero four zero"
    xfail: true
    xfail_reason: >
      PIN-code detection is trigger-gated only. A bare 6-digit number after a
      city name is not yet recognised as a PIN code. Requires a location
      lexicon lookup, deferred.
