# Golden baseline text sets - Phase 0 §9 realisation (SEED)
#
# version: golden@v0.1
#
# COVERAGE NOTE (honest status):
# Phase 0 §9 requires ~200 EN / ~230 TA / ~220 TG items. This SEED contains far
# fewer. It establishes the STRUCTURE, the category taxonomy and the field
# schema so Phase 2 can author to the full floors against a fixed contract.
# The shortfall is recorded in docs/phase1/phase1_exit_report.md as an open gap.
#
# These are INPUT TEXTS ONLY. No audio has been generated, because no TTS model
# exists in this repository (docs/phase1/model_inventory.md). Any future audio
# must be stored outside Git (see .gitignore) per Phase 0 §9.4 / Step 9.
#
# schema: id, lang, script, category, length_bucket, entity_labels, scenario

meta:
  version: "golden@v0.1"
  frozen: false
  audio_generated: false
  audio_blocker: "No TTS model present in repository - Phase 1 blocker B-01"

